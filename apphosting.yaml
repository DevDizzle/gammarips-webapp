# Firebase App Hosting backend config for gammarips-webapp.
# https://firebase.google.com/docs/app-hosting/configure

# Grant the App Hosting scheduler permissions to invoke the service.
iam:
  serviceAccount: scheduler
  roles:
    - roles/run.invoker

runConfig:
  maxInstances: 1

# Public variables — baked into the build + available at runtime.
# NEXT_PUBLIC_* must be `value:` (not secretEnv) so Next.js can inline them
# into the client bundle at build time.
env:
  - variable: MCP_SERVER_URL
    value: https://mcp.gammarips.com

  # Firebase web SDK (public-safe; client rules enforce access control).
  # This MUST be the Firebase-auto-created browser key (UID b7938035-...,
  # the only fida8 key with identitytoolkit.googleapis.com enabled).
  # Sourced from Firebase Console → Project settings → Web app config.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDuAghyUEDchlHL5WkEJeRMaYGqBCB1gD8
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: profitscout-fida8.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: profitscout-fida8
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: profitscout-fida8.firebasestorage.app
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "406581297632"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:406581297632:web:c24bda744fd33784b96b85"

  # Stripe public-side (publishable key + price ID are designed to be public)
  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    value: pk_live_51Rrp1v9rAjmDTprozdVxjqH7hFntQlAovc71LiE4theOZQfuDtcUvCcDPcIq1t0EHIBZn9MVb7h43fnns82hqEai00js1IxoBK
  # Founding offer (created 2026-08-28 via Stripe API): $29/mo founding price,
  # first 100. The old $39 price id was price_1TOlIM9rAjmDTproDjwmelyw and it
  # stays active in Stripe for the existing subscriber. Verified 2026-08-28
  # against the backend resource: this variable is NOT in the Console
  # overrideEnv (only secrets are), so this yaml value alone controls the
  # build. Console overrideEnv, when present, wins over this file.
  - variable: NEXT_PUBLIC_STRIPE_PRICE_ID
    value: price_1U9VqV9rAjmDTprot69xWT12
  # $299/yr annual price. Renders the "or $299/yr" link on /pricing.
  - variable: NEXT_PUBLIC_STRIPE_ANNUAL_PRICE_ID
    value: price_1U9VqV9rAjmDTproVmiKIc9N
  # Billing Portal (cancel/update card) — createStripePortalSession throws without it
  - variable: NEXT_PUBLIC_STRIPE_BILLING_PORTAL_CONFIG_ID
    value: bpc_1SMRaZ9rAjmDTproUFJHV3vW

  # Google Analytics (measurement ID is public)
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: G-ZF0DQVQEKJ

  # OAuth 2.1 authorization server for the MCP (gammarips.com is the issuer;
  # mcp.gammarips.com verifies tokens against /oauth/jwks). The kid names the
  # current signing key in the JWKS. Rotation: create a new secret version +
  # new kid here, and carry the old pair for one hour as
  #   - variable: OAUTH_SIGNING_KID_PREV   value: "<old kid>"
  #   - variable: OAUTH_SIGNING_KEY_PREV   secret: OAUTH_SIGNING_KEY_PREV  (RUNTIME)
  # so tokens signed before the rotation still verify until they expire.
  - variable: OAUTH_ISSUER
    value: https://gammarips.com
  - variable: OAUTH_SIGNING_KID
    value: "2026-08-19"
  # The private key. Declared HERE, in `env:` with `secret:`, because that is
  # the App Hosting schema. The top-level `secretEnv:` block below is NOT part
  # of the schema and the preparer ignores it silently (verified in the
  # 2026-08-19 build log: none of those entries reach the revision; the live
  # secrets come from values typed into the Firebase Console). RUNTIME only:
  # the build never signs a token.
  - variable: OAUTH_SIGNING_KEY
    secret: OAUTH_SIGNING_KEY
    availability:
      - RUNTIME

  # Google Analytics Measurement Protocol secret, for the server-side purchase
  # event fired by the Stripe webhook. Moved here from the dead `secretEnv:`
  # block on 2026-08-31 (see the WARNING below) so it actually reaches the
  # runtime. RUNTIME only: the build never sends an event.
  #
  # Root cause of four months of zero `purchase` events in GA4: property
  # 534472819 had never attested the User Data Collection Acknowledgement, so
  # NO Measurement Protocol secret could exist on the stream at all. The value
  # stored in Secret Manager on 2026-02-02 could therefore never have been
  # valid. Attested and re-minted 2026-08-31 (secret id 15534172427);
  # GA_API_SECRET is now at version 2.
  - variable: GA_API_SECRET
    secret: GA_API_SECRET
    availability:
      - RUNTIME

  # Shared secret for the reconcile-keys cron (Cloud Scheduler job
  # `mcp-reconcile-keys`, 08:00 daily, sends it as the x-reconcile-secret
  # header on POST /api/cron/reconcile-keys).
  #
  # This was a Firebase Console variable that ended up with a NAME AND NO
  # VALUE. App Hosting then rejects the whole config with
  #   fah/invalid-apphosting-yaml: either 'value' or 'secret' field is required
  # and EVERY deploy fails, whatever is in the commit. That is what blocked the
  # 2026-08-31 18:47 and 18:51 builds. Verified the Secret Manager value is the
  # same one the scheduler sends (sha256 match, 64 chars, no trailing newline),
  # so sourcing it here is a like-for-like swap. Delete the empty console row.
  - variable: RECONCILE_CRON_SECRET
    secret: RECONCILE_CRON_SECRET
    availability:
      - RUNTIME

# Server-side secrets pulled from Google Secret Manager at runtime.
# Each secret must be granted to the App Hosting service account —
# use `firebase apphosting:secrets:grantaccess <NAME> --backend=gammarips-webapp`.
#
# WARNING (found 2026-08-19): `secretEnv:` is NOT an App Hosting schema key.
# The preparer ignores this whole block. What the live backend actually gets
# is (a) the plain `env:` values above and (b) env vars set in the Firebase
# Console (App Hosting > backend > Settings), where these secrets were typed
# in as plain values. A secret that should reach the runtime must be declared
# in `env:` as `- variable: NAME` + `secret: NAME` (see OAUTH_SIGNING_KEY).
# Migrating the rest is an owner call (the console values are the live ones;
# the Secret Manager copies may differ).
secretEnv:
  # Cron authentication
  - secret: CRON_SECRET
    env: CRON_SECRET

  # Stripe (checkout + webhook)
  - secret: STRIPE_SECRET_KEY
    env: STRIPE_SECRET_KEY
  - secret: STRIPE_WEBHOOK_SECRET
    env: STRIPE_WEBHOOK_SECRET

  # Mailgun (welcome + trial-reminder + transactional)
  - secret: MAILGUN_SENDING_KEY
    env: MAILGUN_SENDING_KEY
  - secret: MAILGUN_API_KEY
    env: MAILGUN_API_KEY
  - secret: MAILGUN_DOMAIN
    env: MAILGUN_DOMAIN

  # WhatsApp group invite (referenced in welcome email)
  - secret: WHATSAPP_GROUP_INVITE_URL
    env: WHATSAPP_GROUP_INVITE_URL

  # Firebase Admin SDK (server-side Firestore + Auth)
  - secret: FIREBASE_CLIENT_EMAIL
    env: FIREBASE_CLIENT_EMAIL
  - secret: FIREBASE_PRIVATE_KEY
    env: FIREBASE_PRIVATE_KEY
  - secret: FIREBASE_PROJECT_ID
    env: FIREBASE_PROJECT_ID

  # GA_API_SECRET moved to `env:` above on 2026-08-31 — it is the one secret
  # in this file that is actually wired the supported way. The rest of this
  # block still does nothing; migrating them stays an owner call.

  # Gemini / Google AI (used by enrichment + arena features)
  - secret: GEMINI_API_KEY
    env: GEMINI_API_KEY
  - secret: GOOGLE_API_KEY
    env: GOOGLE_API_KEY

  # Market data APIs (Polygon primary; FMP legacy, still referenced in some routes)
  - secret: POLYGON_API_KEY
    env: POLYGON_API_KEY
  - secret: FMP_API_KEY
    env: FMP_API_KEY
