# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

# Grant the App Hosting scheduler permissions to invoke the service.
iam:
  serviceAccount: scheduler
  roles:
    - roles/run.invoker

env:
  - variable: MCP_SERVER_URL
    value: https://profitscout-mcp-469352939749.us-central1.run.app
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAqZq_gQLIxGSw3en_P7tgv6UfPlcKybDk
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: profitscout-fida8.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: profitscout-fida8
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: profitscout-fida8.firebasestorage.app
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "406581297632"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:406581297632:web:c24bda744fd33784b96b85
  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    value: pk_live_51Rrp1v9rAjmDTprozdVxjqH7hFntQlAovc71LiE4theOZQfuDtcUvCcDPcIq1t0EHIBZn9MVb7h43fnns82hqEai00js1IxoBK
  - variable: NEXT_PUBLIC_STRIPE_PRICE_ID
    value: price_1SB4zD9rAjmDTprowECByAKk
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: G-KPGTJDBC6N

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

# Defines server-side cron jobs for the application.
# https://firebase.google.com/docs/app-hosting/scheduled-jobs
scheduledJobs:
  - schedule: "0 20 * * 1-4" # 8:00 PM ET on Mon, Tue, Wed, Thu
    timeZone: America/New_York
    httpTarget:
      uri: /api/cron/send-daily-setups
  - schedule: "0 8 * * 1-5" # 8:00 AM ET on Mon-Fri
    timeZone: America/New_York
    httpTarget:
      uri: /api/cron/send-top-pick
  - schedule: "0 13 * * 1-5" # 1:00 PM ET on Mon-Fri
    timeZone: America/New_York
    httpTarget:
      uri: /api/cron/send-midday-movers
  - schedule: "0 10 * * *" # 10:00 AM ET every day
    timeZone: America/New_York
    httpTarget:
      uri: /api/cron/send-feedback-requests

# Make secrets available to the run environment.
# https://firebase.google.com/docs/app-hosting/configure#secrets
secretEnv:
  - secret: CRON_SECRET
    env: CRON_SECRET
  - secret: FIREBASE_PROJECT_ID
    env: FIREBASE_PROJECT_ID
  - secret: FIREBASE_CLIENT_EMAIL
    env: FIREBASE_CLIENT_EMAIL
  - secret: FIREBASE_PRIVATE_KEY
    env: FIREBASE_PRIVATE_KEY
  - secret: GEMINI_API_KEY
    env: GEMINI_API_KEY
  - secret: GOOGLE_API_KEY
    env: GOOGLE_API_KEY
  - secret: STRIPE_SECRET_KEY
    env: STRIPE_SECRET_KEY
  - secret: STRIPE_WEBHOOK_SECRET
    env: STRIPE_WEBHOOK_SECRET
  - secret: MAILGUN_SENDING_KEY
    env: MAILGUN_SENDING_KEY
  - secret: MAILGUN_DOMAIN
    env: MAILGUN_DOMAIN
  - secret: MAILGUN_API_KEY
    env: MAILGUN_API_KEY
  - secret: FMP_API_KEY
    env: FMP_API_KEY
  - secret: POLYGON_API_KEY
    env: POLYGON_API_KEY
  - secret: GA_API_SECRET
    env: GA_API_SECRET
